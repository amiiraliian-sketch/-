name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build APK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git zip unzip
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: Build
        run: |
          buildozer init
          sed -i 's/^title = .*/title = Accounting/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = accounting/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.example/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-APK
          path: bin/*.apk
